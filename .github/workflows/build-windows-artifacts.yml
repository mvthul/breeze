name: Build Windows Artifacts (Helper & Viewer)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit'
        required: true
        default: 'main'

jobs:
  build-agent-windows:
    name: Build Breeze Agent (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Build agent and user helper
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          scripts/build-edition.sh --edition self-host --component agent \
            --goos windows --goarch amd64 --version dev \
            --out ../breeze-agent-windows-amd64.exe
          scripts/build-edition.sh --edition self-host --component user-helper \
            --goos windows --goarch amd64 --version dev --windowsgui \
            --out ../breeze-user-helper-windows-amd64.exe

      - name: Upload Agent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: breeze-agent-windows
          path: breeze-agent-windows-amd64.exe

      - name: Upload User Helper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: breeze-user-helper-windows
          path: breeze-user-helper-windows-amd64.exe

  build-helper-windows:
    name: Build Breeze Helper (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.34.5'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri helper
        working-directory: apps/helper
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
        run: |
          Set-Content -Path tauri-test-config.json -Value '{"bundle":{"createUpdaterArtifacts":false}}'
          pnpm tauri build --target x86_64-pc-windows-msvc --config tauri-test-config.json

      - name: Upload Helper MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: breeze-helper-windows-msi
          path: apps/helper/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

      - name: Upload Helper EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: breeze-helper-windows-exe
          path: apps/helper/src-tauri/target/x86_64-pc-windows-msvc/release/breeze-helper.exe

  build-viewer-windows:
    name: Build Breeze Viewer (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.34.5'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Viewer
        working-directory: apps/viewer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
        run: |
          Set-Content -Path tauri-test-config.json -Value '{"bundle":{"createUpdaterArtifacts":false}}'
          pnpm tauri build --target x86_64-pc-windows-msvc --config tauri-test-config.json

      - name: Upload Viewer MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: breeze-viewer-windows-msi
          path: apps/viewer/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

      - name: Upload Viewer EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: breeze-viewer-windows-exe
          path: apps/viewer/src-tauri/target/x86_64-pc-windows-msvc/release/breeze-viewer.exe
